<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课题组协作资料库</title>
<style>
:root{--ink:#1c283a;--paper:#faf9f6;--line:#d9d9d2;--accent:#923d31}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}main,.bar{max-width:1220px;margin:auto;padding:0 clamp(18px,5vw,72px)}header{border-top:5px solid var(--ink);border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;justify-content:space-between;height:57px}.brand{font-weight:700}.brand:before{content:"";display:inline-block;width:12px;height:16px;margin-right:10px;vertical-align:-2px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:4px}.bar>a:last-child{font-size:14px}
.intro{padding:clamp(36px,6vw,76px) 0 32px;border-bottom:2px solid var(--ink)}h1,h3{font-family:Georgia,"Songti SC",SimSun,serif}h1{font-size:clamp(38px,5vw,72px);letter-spacing:-.055em;line-height:1.1;margin:0 0 25px}.search{max-width:820px;background:white;border:1px solid #919995;display:flex;align-items:center;padding:0 18px;gap:12px;min-height:54px;border-radius:4px}.search:focus-within{outline:2px solid var(--accent)}.lens{width:16px;height:16px;border:2px solid;border-radius:50%;position:relative;flex:none}.lens:after{content:"";position:absolute;width:8px;height:2px;background:var(--ink);transform:rotate(45deg);right:-6px;bottom:-4px}input{width:100%;border:0;outline:none;font:inherit;background:transparent;color:inherit;padding:12px 4px}
.layout{display:grid;grid-template-columns:172px minmax(0,1fr);gap:clamp(30px,5vw,74px);padding:30px 0 70px}.layout nav h2{font-size:14px;color:#606862;margin:0 0 12px}.filters button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:9px 11px}.filters button[aria-pressed=true]{background:#e9e9e1;box-shadow:inset 3px 0 var(--accent);font-weight:700}.filters b{font:13px monospace;color:#586266}.heading{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px}.heading h2{font-size:20px;margin:0}.heading span,small{font-size:14px;color:#62695f}ul{margin:0;padding:0;list-style:none}li{border-bottom:1px solid var(--line)}article{display:flex;align-items:flex-start;gap:28px;padding:26px 0}.entry{flex:1;min-width:0}small{color:var(--accent)}h3{margin:7px 0;font-size:clamp(24px,2.4vw,35px);line-height:1.3}.entry p{margin:12px 0;color:#4a5360}.shortcuts{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:14px;color:var(--accent)}.figure{width:32%;background:white;border:1px solid var(--line);padding:10px}.figure img{display:block;width:100%;height:130px;object-fit:contain}.figure span{font-size:12px;color:#666}.excerpt{border-left:2px solid #b58464;padding-left:10px}mark{background:#ffe6af}button:focus-visible,a:focus-visible{outline:2px solid var(--accent)}[hidden]{display:none!important}
@media(max-width:740px){.layout{grid-template-columns:minmax(0,1fr);gap:24px}.layout nav,.layout section{min-width:0}.filters{display:flex;gap:5px;overflow-x:auto}.filters button{width:auto;white-space:nowrap;gap:6px}.figure{width:28%}.figure img{height:64px}article{gap:12px}.intro{padding-top:36px}.layout nav h2{margin-bottom:6px}}
.tools{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px}.tools label{font-size:14px}.tools select{padding:7px;border:1px solid #ccc;background:white;color:inherit;border-radius:4px}.entry{width:100%}.entry details{margin-top:16px}.entry summary{cursor:pointer;color:#754036}</style></head><body><header><div class="bar"><a class="brand" href="./">课题组资料库</a><a href="https://github.com/zzrdearea/literature-library#成员投稿">投稿指南 ↗</a></div></header><main><section class="intro"><h1>小组工作台</h1><label class="search"><span aria-hidden="true" class="lens"></span><input type="search" id="q" aria-label="搜索工作、成员或材料" placeholder="搜索工作名称、成员或文件名"></label></section>
<div class="layout"><nav aria-label="工作分类"><h2>工作分类</h2><div class="filters">@@NAV@@</div></nav><section><div class="tools"><label>参与人 <select id="member"><option value="">全部成员</option>@@PEOPLE@@</select></label><label>状态 <select id="state"><option value="">全部状态</option><option>进行中</option><option>已完成</option><option>待更新</option><option>资料分享</option></select></label></div><div class="heading"><h2>最近更新</h2><span aria-live="polite" id="total"></span></div><ul>@@REPORTS@@</ul><p id="message" role="status"></p></section></div></main>
<script>
const rows=[...document.querySelectorAll('[data-group]')], buttons=[...document.querySelectorAll('[data-key]')];
const q=document.querySelector('#q'), member=document.querySelector('#member'), state=document.querySelector('#state');
const url=new URL(location.href);let key=url.searchParams.get('category')||'all';
if(!buttons.some(b=>b.dataset.key===key))key='all';
q.value=url.searchParams.get('q')||'';
member.value=url.searchParams.get('member')||'';state.value=url.searchParams.get('status')||'';
function render(){
 let count=0;
 for(const row of rows){
  const visible=(key==='all'||row.dataset.group===key)&&(!member.value||JSON.parse(row.dataset.people).includes(member.value))&&(!state.value||state.value===row.dataset.status)&&row.dataset.search.toLowerCase().includes(q.value.trim().toLowerCase());
  row.hidden=!visible;if(visible)count++;
 }
 for(const b of buttons)b.setAttribute('aria-pressed',String(b.dataset.key===key));
 for(const [name,value] of Object.entries({category:key==='all'?'':key,q:q.value,member:member.value,status:state.value})){
  if(value)url.searchParams.set(name,value);else url.searchParams.delete(name);
 }
 history.replaceState(null,'',url);document.querySelector('#total').textContent=count+' 项';
 document.querySelector('#message').textContent=count?'':'当前条件下暂无工作条目。';
}
for(const b of buttons)b.onclick=()=>{key=b.dataset.key;render()};
q.oninput=member.onchange=state.onchange=render;render();
</script></body></html>
